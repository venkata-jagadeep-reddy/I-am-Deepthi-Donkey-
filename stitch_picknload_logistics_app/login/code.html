<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "secondary-fixed": "#dce2f7", "on-tertiary": "#ffffff", "primary-fixed": "#ffddb8", "on-surface": "#151c27", "inverse-primary": "#ffb95f", "primary-container": "#f59e0b", "on-error": "#ffffff", "on-primary-fixed-variant": "#653e00", "surface-dim": "#d3daea", "primary": "#855300", "on-tertiary-fixed-variant": "#005320", "surface-bright": "#f9f9ff", "background": "#f9f9ff", "inverse-on-surface": "#ebf1ff", "surface-variant": "#dce2f3", "on-background": "#151c27", "surface-container-high": "#e2e8f8", "surface-container-lowest": "#ffffff", "outline": "#867461", "secondary": "#575e70", "error-container": "#ffdad6", "secondary-container": "#d9dff5", "on-secondary-fixed": "#141b2b", "surface-container-highest": "#dce2f3", "secondary-fixed-dim": "#c0c6db", "tertiary-fixed-dim": "#62df7d", "on-primary": "#ffffff", "on-primary-fixed": "#2a1700", "surface": "#f9f9ff", "surface-tint": "#855300", "inverse-surface": "#2a313d", "tertiary-fixed": "#7ffc97", "on-secondary": "#ffffff", "surface-container": "#e7eefe", "primary-fixed-dim": "#ffb95f", "tertiary-container": "#4ac86a", "on-tertiary-container": "#004f1f", "outline-variant": "#d8c3ad", "on-surface-variant": "#534434", "on-secondary-fixed-variant": "#404758", "on-secondary-container": "#5c6274", "error": "#ba1a1a", "on-tertiary-fixed": "#002109", "surface-container-low": "#f0f3ff", "on-primary-container": "#613b00", "tertiary": "#006e2d", "on-error-container": "#93000a" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin": "1.25rem", "space-md": "1rem", "space-sm": "0.5rem", "space-xl": "1.5rem", "space-xs": "0.25rem", "space-lg": "1.25rem", "gutter": "1rem" }, fontFamily: { "body-lg": ["Inter"], "body-md-medium": ["Inter"], "headline-md": ["Inter"], "body-lg-bold": ["Inter"], "label-sm": ["Inter"], "headline-xl": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"] }, fontSize: { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-xl": ["26px", { "lineHeight": "32px", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface truncate">Phone Login</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface"><div class="flex flex-col w-full">
<div class="px-margin flex flex-col justify-between pt-space-lg pb-space-xl" style="min-height: calc(100vh - 4rem);">
<div>
<div class="flex flex-col items-start pt-space-sm">
<div class="w-14 h-14 rounded-xl bg-primary-container flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-on-surface text-[32px]">local_shipping</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface mt-space-md tracking-tight">
          Welcome to PickNLoad
        </h1>
<p class="font-body-md text-body-md text-secondary mt-space-xs">
          Enter your mobile number to continue
        </p>
</div>
<div class="mt-space-xl flex flex-col">
<label class="font-label-md text-label-md text-on-surface mb-space-xs" for="mobile-number">
          Phone Number
        </label>
<div class="flex items-center w-full">
<div class="h-[52px] px-3.5 rounded-xl bg-surface-container-low flex items-center justify-center gap-1.5 shadow-sm shrink-0 mr-space-xs">
<span aria-hidden="true" class="text-base select-none">🇮🇳</span>
<span class="font-body-md-medium text-body-md-medium text-on-surface">+91</span>
</div>
<div class="relative flex-1">
<input autocomplete="tel" class="w-full h-[52px] px-4 rounded-xl bg-surface-container-lowest font-body-lg text-body-lg text-on-surface placeholder:text-secondary shadow-sm outline-none transition-all" id="mobile-number" inputmode="numeric" maxlength="10" pattern="[0-9]*" placeholder="10-digit mobile number" type="tel">
</div>
</div>
<div class="flex items-center gap-2 mt-3 text-secondary text-label-sm font-label-sm" id="quick-hints">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span>We'll send a 6-digit OTP for instant login</span>
</div>
<button class="w-full h-[52px] mt-space-lg rounded-xl font-body-lg-bold text-body-lg-bold flex items-center justify-center transition-all bg-surface-container-high text-secondary cursor-not-allowed select-none" disabled="" id="get-otp-btn" type="button">
<span>Get OTP</span>
</button>
</div>
</div>
<div class="mt-space-xl pt-space-lg text-center">
<p class="font-label-sm text-label-sm text-secondary leading-relaxed">
        By continuing, you agree to our 
        <a class="text-primary font-body-md-medium hover:underline" href="#terms">Terms</a> 
        and 
        <a class="text-primary font-body-md-medium hover:underline" href="#privacy">Privacy Policy</a>
</p>
</div>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('mobile-number');
    const btn = document.getElementById('get-otp-btn');

    if (!input || !btn) return;

    input.addEventListener('input', (e) => {
      let val = e.target.value.replace(/\D/g, '');
      if (val.length > 10) val = val.slice(0, 10);
      e.target.value = val;

      if (val.length === 10) {
        btn.removeAttribute('disabled');
        btn.classList.remove('bg-surface-container-high', 'text-secondary', 'cursor-not-allowed');
        btn.classList.add('bg-primary-container', 'text-on-surface', 'shadow-md', 'active:scale-[0.99]');
      } else {
        btn.setAttribute('disabled', 'true');
        btn.classList.add('bg-surface-container-high', 'text-secondary', 'cursor-not-allowed');
        btn.classList.remove('bg-primary-container', 'text-on-surface', 'shadow-md', 'active:scale-[0.99]');
      }
    });

    btn.addEventListener('click', () => {
      if (input.value.length === 10) {
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px] mr-2">progress_activity</span><span>Sending OTP...</span>';
        btn.setAttribute('disabled', 'true');
      }
    });
  })();
</script></main></body></html>
