: ["Inter"], "body-md-medium": ["Inter"], "headline-md": ["Inter"], "body-lg-bold": ["Inter"], "label-sm": ["Inter"], "headline-xl": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"] }, fontSize: { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-md-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-lg-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "headline-xl": ["26px", { "lineHeight": "32px", "fontWeight": "700" }], "label-md": ["13px", { "lineHeight": "16px", "fontWeight": "600" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }] } } } };</script><style>@layer base { html, body { width: 100vw; margin: 0; padding: 0; } body { overscroll-behavior: none; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; }</style></head><body class="bg-surface-container-lowest font-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full bg-surface-container-lowest pt-safe pb-safe"><div class="flex flex-col w-full min-h-[780px] justify-between items-center px-margin select-none py-12">
<div class="w-full flex justify-end items-center opacity-0 pointer-events-none">

</div>
<div class="flex flex-col items-center justify-center text-center -mt-8">
<div class="relative flex items-center justify-center mb-6">
<div class="absolute -inset-2 bg-primary-container/10 rounded-3xl blur-md"></div>
<div class="relative w-20 h-20 bg-primary-container rounded-2xl flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-surface-container-lowest text-[44px]" style="font-variation-settings: 'FILL' 1, 'wght' 600;">local_shipping</span>
</div>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight font-bold">PickNLoad</h1>
<p class="font-body-md text-body-md text-secondary mt-1 tracking-normal font-normal">Move goods. Find nearby drivers.</p>
<div class="mt-6 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-secondary">
<span class="material-symbols-outlined text-[15px] text-tertiary" style="font-variation-settings: 'FILL' 1;">verified</span>
<span class="font-label-sm text-label-sm text-on-surface-variant font-medium">Intra-City Logistics Network</span>
</div>
</div>
<div class="w-full flex flex-col items-center justify-center gap-4 pb-4">
<div class="w-48 h-1.5 bg-surface-container-high rounded-full overflow-hidden relative">
<div class="h-full bg-primary-container rounded-full w-0 transition-all duration-300 ease-out" id="splash-progress"></div>
</div>
<div class="flex items-center gap-2">
<div class="w-1.5 h-1.5 rounded-full bg-tertiary-container animate-ping"></div>
<span class="font-label-sm text-label-sm text-secondary tracking-wide" id="splash-status">Connecting nearby fleet...</span>
</div>
<div class="mt-2 text-center">
<p class="font-label-sm text-label-sm text-secondary/60">Fast. Reliable. Verified Hauling.</p>
</div>
</div>
</div>
<script>
  (function() {
    const progressBar = document.getElementById('splash-progress');
    const statusText = document.getElementById('splash-status');
    
    const steps = [
      { width: '22%', text: 'Verifying GPS signal...' },
      { width: '58%', text: 'Connecting nearby fleet...' },
      { width: '86%', text: 'Loading vehicle rates...' },
      { width: '100%', text: 'Ready' }
    ];

    let currentStep = 0;
    const interval = setInterval(() => {
      if (currentStep < steps.length) {
        progressBar.style.width = steps[currentStep].width;
        statusText.textContent = steps[currentStep].text;
        currentStep++;
      } else {
        clearInterval(interval);
      }
    }, 450);
  })();
</script></main></body></html>
