<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "tertiary-container": "#4ac86a", "surface-container-high": "#e2e8f8", "on-primary-fixed": "#2a1700", "on-error-container": "#93000a", "inverse-on-surface": "#ebf1ff", "on-tertiary-container": "#004f1f", "surface": "#f9f9ff", "tertiary-fixed": "#7ffc97", "secondary": "#575e70", "surface-container-low": "#f0f3ff", "primary-container": "#f59e0b", "surface-bright": "#f9f9ff", "surface-dim": "#d3daea", "inverse-primary": "#ffb95f", "surface-tint": "#855300", "on-tertiary-fixed": "#002109", "outline": "#867461", "primary": "#855300", "secondary-container": "#d9dff5", "inverse-surface": "#2a313d", "outline-variant": "#d8c3ad", "on-secondary": "#ffffff", "surface-container-lowest": "#ffffff", "on-background": "#151c27", "surface-container-highest": "#dce2f3", "on-surface-variant": "#534434", "on-secondary-container": "#5c6274", "on-primary": "#ffffff", "on-primary-fixed-variant": "#653e00", "surface-container": "#e7eefe", "secondary-fixed": "#dce2f7", "primary-fixed": "#ffddb8", "on-primary-container": "#613b00", "on-error": "#ffffff", "secondary-fixed-dim": "#c0c6db", "on-tertiary": "#ffffff", "on-surface": "#151c27", "tertiary-fixed-dim": "#62df7d", "error": "#ba1a1a", "surface-variant": "#dce2f3", "primary-fixed-dim": "#ffb95f", "tertiary": "#006e2d", "on-secondary-fixed-variant": "#404758", "background": "#f9f9ff", "on-tertiary-fixed-variant": "#005320", "error-container": "#ffdad6", "on-secondary-fixed": "#141b2b" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "space-xl": "1.5rem", "space-sm": "0.5rem", "margin": "1.25rem", "space-lg": "1.25rem", "space-xs": "0.25rem", "gutter": "1rem", "space-md": "1rem" }, "fontFamily": { "body-md": ["Inter"], "headline-md": ["Inter"], "label-md": ["Inter"], "body-md-medium": ["Inter"], "headline-lg": ["Inter"], "label-sm": ["Inter"], "body-lg": ["Inter"], "body-lg-bold": ["Inter"], "headline-xl": ["Inter"] }, "fontSize": { "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["13px", { "lineHeight": "16px", "fontWeight": "600" }], "body-md-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }], "headline-lg": ["22px", { "lineHeight": "28px", "fontWeight": "700" }], "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "body-lg-bold": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-xl": ["26px", { "lineHeight": "32px", "fontWeight": "700" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface-container-lowest font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface-container-lowest/90 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.04)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Go back" class="w-11 h-11 -ml-space-xs flex items-center justify-center text-on-surface rounded-full hover:bg-surface-container-low transition-colors" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-md text-headline-md text-on-surface">Create Request</h1></div><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 bg-surface-container-lowest"><div class="flex flex-col w-full pb-24">
<!-- Content Area: Form elements stacked with standard 16px gaps -->
<div class="flex flex-col gap-space-md w-full pt-space-xs">
<!-- 1 & 2. Route Section (Pickup & Drop) -->
<div class="flex flex-col gap-space-xs">
<!-- Pickup location -->
<label class="font-label-sm text-label-sm text-secondary font-medium">Pickup location</label>
<div class="flex items-center justify-between h-[52px] px-space-md rounded-xl bg-surface-container-lowest shadow-sm" style="box-shadow: 0 0 0 1px #E5E7EB;">
<div class="flex items-center gap-space-sm min-w-0 pr-space-xs">
<span class="w-2.5 h-2.5 rounded-full bg-tertiary shrink-0"></span>
<span class="font-body-md text-body-md text-on-surface truncate font-medium">Tumakuru Market</span>
</div>
<button class="h-11 px-2.5 flex items-center justify-center font-label-md text-label-md text-primary font-semibold hover:bg-surface-container-low rounded-lg transition-colors shrink-0" type="button">
          Edit
        </button>
</div>
<!-- Connecting dotted indicator visual (tactile logistics affordance) -->
<div class="flex items-center pl-space-md py-0.5">
<div class="w-2.5 flex justify-center">
<div class="w-0.5 h-3 bg-secondary-container rounded-full"></div>
</div>
</div>
<!-- Drop location -->
<label class="font-label-sm text-label-sm text-secondary font-medium">Drop location</label>
<div class="flex items-center justify-between h-[52px] px-space-md rounded-xl bg-surface-container-lowest shadow-sm" style="box-shadow: 0 0 0 1px #E5E7EB;">
<div class="flex items-center gap-space-sm min-w-0 pr-space-xs">
<span class="material-symbols-outlined text-error text-[20px] shrink-0">location_on</span>
<span class="font-body-md text-body-md text-on-surface truncate font-medium">Kunigal</span>
</div>
<button class="h-11 px-2.5 flex items-center justify-center font-label-md text-label-md text-primary font-semibold hover:bg-surface-container-low rounded-lg transition-colors shrink-0" type="button">
          Edit
        </button>
</div>
<!-- Route metadata -->
<div class="flex items-center gap-1.5 px-space-xs pt-1">
<span class="material-symbols-outlined text-secondary text-[16px]">straighten</span>
<span class="font-label-sm text-label-sm text-secondary">Approx. 38 km</span>
</div>
</div>
<!-- 3. Cargo Type Section -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-secondary font-medium" for="goods-input">What are you moving?</label>
<div class="relative w-full">
<input class="w-full h-[52px] px-space-md rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-secondary focus:outline-none transition-shadow" id="goods-input" onblur="this.style.boxShadow='0 0 0 1px #E5E7EB'" onfocus="this.style.boxShadow='0 0 0 2px #F59E0B'" placeholder="e.g. Vegetables, furniture, cement bags" style="box-shadow: 0 0 0 1px #E5E7EB;" type="text">
</div>
<!-- Quick-pick suggested chips -->
<div class="flex items-center gap-2 overflow-x-auto pt-1.5 pb-0.5 no-scrollbar">
<button class="cargo-chip h-9 px-3.5 shrink-0 rounded-lg bg-surface-container-lowest font-body-md text-label-md text-on-surface flex items-center justify-center hover:bg-surface-container-low transition-colors" onclick="selectCargo(this, 'Vegetables')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
          Vegetables
        </button>
<button class="cargo-chip h-9 px-3.5 shrink-0 rounded-lg bg-surface-container-lowest font-body-md text-label-md text-on-surface flex items-center justify-center hover:bg-surface-container-low transition-colors" onclick="selectCargo(this, 'Furniture')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
          Furniture
        </button>
<button class="cargo-chip h-9 px-3.5 shrink-0 rounded-lg bg-surface-container-lowest font-body-md text-label-md text-on-surface flex items-center justify-center hover:bg-surface-container-low transition-colors" onclick="selectCargo(this, 'Grains')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
          Grains
        </button>
<button class="cargo-chip h-9 px-3.5 shrink-0 rounded-lg bg-surface-container-lowest font-body-md text-label-md text-on-surface flex items-center justify-center hover:bg-surface-container-low transition-colors" onclick="selectCargo(this, 'Boxes')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
          Boxes
        </button>
</div>
</div>
<!-- 4. Weight Section -->
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-secondary font-medium" for="weight-input">Approximate weight</label>
<div class="relative w-full flex items-center">
<input class="w-full h-[52px] pl-space-md pr-12 rounded-xl bg-surface-container-lowest text-on-surface font-body-md text-body-md placeholder:text-secondary focus:outline-none transition-shadow" id="weight-input" inputmode="numeric" onblur="this.style.boxShadow='0 0 0 1px #E5E7EB'" onfocus="this.style.boxShadow='0 0 0 2px #F59E0B'" placeholder="e.g. 400" style="box-shadow: 0 0 0 1px #E5E7EB;" type="number">
<div class="absolute right-0 top-0 h-[52px] pr-space-md flex items-center pointer-events-none">
<span class="font-label-md text-label-md text-secondary font-semibold">kg</span>
</div>
</div>
</div>
<!-- 5. Vehicle Select Grid -->
<div class="flex flex-col gap-1.5">
<div class="flex items-center justify-between">
<label class="font-label-sm text-label-sm text-secondary font-medium">Select vehicle</label>
<span class="font-label-sm text-label-sm text-secondary">Capacity guide</span>
</div>
<div class="grid grid-cols-2 gap-3 w-full">
<!-- Card 1: Tata Ace -->
<button class="vehicle-card flex flex-col p-3.5 text-left rounded-2xl bg-surface-container-lowest min-h-[96px] justify-between relative transition-all active:scale-[0.98]" onclick="selectVehicle(this, 'tata_ace')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<div class="flex items-center justify-between w-full">
<span class="material-symbols-outlined text-on-surface text-[24px]">local_shipping</span>
<span class="selected-badge hidden material-symbols-outlined text-primary text-[18px]">check_circle</span>
</div>
<div class="flex flex-col mt-2">
<span class="font-body-md-medium text-body-md-medium text-on-surface font-semibold leading-tight">Tata Ace</span>
<span class="font-label-sm text-label-sm text-secondary mt-0.5">750 kg</span>
</div>
</button>
<!-- Card 2: Pickup Truck -->
<button class="vehicle-card flex flex-col p-3.5 text-left rounded-2xl bg-surface-container-lowest min-h-[96px] justify-between relative transition-all active:scale-[0.98]" onclick="selectVehicle(this, 'pickup')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<div class="flex items-center justify-between w-full">
<span class="material-symbols-outlined text-on-surface text-[24px]">rv_hookup</span>
<span class="selected-badge hidden material-symbols-outlined text-primary text-[18px]">check_circle</span>
</div>
<div class="flex flex-col mt-2">
<span class="font-body-md-medium text-body-md-medium text-on-surface font-semibold leading-tight">Pickup Truck</span>
<span class="font-label-sm text-label-sm text-secondary mt-0.5">1 t</span>
</div>
</button>
<!-- Card 3: Mini Truck -->
<button class="vehicle-card flex flex-col p-3.5 text-left rounded-2xl bg-surface-container-lowest min-h-[96px] justify-between relative transition-all active:scale-[0.98]" onclick="selectVehicle(this, 'mini_truck')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<div class="flex items-center justify-between w-full">
<span class="material-symbols-outlined text-on-surface text-[24px]">front_loader</span>
<span class="selected-badge hidden material-symbols-outlined text-primary text-[18px]">check_circle</span>
</div>
<div class="flex flex-col mt-2">
<span class="font-body-md-medium text-body-md-medium text-on-surface font-semibold leading-tight">Mini Truck</span>
<span class="font-label-sm text-label-sm text-secondary mt-0.5">1.5 t</span>
</div>
</button>
<!-- Card 4: Other -->
<button class="vehicle-card flex flex-col p-3.5 text-left rounded-2xl bg-surface-container-lowest min-h-[96px] justify-between relative transition-all active:scale-[0.98]" onclick="selectVehicle(this, 'other')" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<div class="flex items-center justify-between w-full">
<span class="material-symbols-outlined text-on-surface text-[24px]">more_horiz</span>
<span class="selected-badge hidden material-symbols-outlined text-primary text-[18px]">check_circle</span>
</div>
<div class="flex flex-col mt-2">
<span class="font-body-md-medium text-body-md-medium text-on-surface font-semibold leading-tight">Other</span>
<span class="font-label-sm text-label-sm text-secondary mt-0.5">Custom size</span>
</div>
</button>
</div>
</div>
<!-- 6. Special Requirements (Optional) -->
<div class="flex flex-col gap-1.5 pb-2">
<label class="font-label-sm text-label-sm text-secondary font-medium">Special requirements (optional)</label>
<div class="flex flex-wrap gap-2 pt-0.5">
<button class="req-chip h-10 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all select-none" onclick="toggleRequirement(this)" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<span class="material-symbols-outlined text-secondary text-[16px]">warning</span>
<span>Fragile</span>
</button>
<button class="req-chip h-10 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all select-none" onclick="toggleRequirement(this)" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<span class="material-symbols-outlined text-secondary text-[16px]">front_hand</span>
<span>Loading assistance</span>
</button>
<button class="req-chip h-10 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all select-none" onclick="toggleRequirement(this)" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<span class="material-symbols-outlined text-secondary text-[16px]">roofing</span>
<span>Covered vehicle</span>
</button>
<button class="req-chip h-10 px-3.5 rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md flex items-center gap-1.5 transition-all select-none" onclick="toggleRequirement(this)" style="box-shadow: 0 0 0 1px #E5E7EB;" type="button">
<span class="material-symbols-outlined text-secondary text-[16px]">weight</span>
<span>Heavy goods</span>
</button>
</div>
</div>
</div>
<!-- Sticky Bottom Operational Action Bar -->
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface-container-lowest/95 backdrop-blur-md px-margin py-3 pb-safe shadow-[0_-4px_16px_rgba(0,0,0,0.04)]">
<div class="w-full max-w-md mx-auto">
<button class="w-full h-[52px] rounded-xl flex items-center justify-center font-body-lg-bold text-body-lg-bold transition-all bg-[#E5E7EB] text-[#9CA3AF] cursor-not-allowed select-none" disabled="" id="btn-continue" type="button">
        Continue
      </button>
</div>
</div>
</div>
<script>
  // Interactive micro-interactions & reactive form state handling
  let selectedVehicleId = null;
  const cargoInput = document.getElementById('goods-input');
  const weightInput = document.getElementById('weight-input');
  const continueBtn = document.getElementById('btn-continue');

  function checkFormValidity() {
    const hasCargo = cargoInput.value.trim().length > 0;
    const hasWeight = weightInput.value.trim().length > 0;
    const hasVehicle = selectedVehicleId !== null;

    if (hasCargo && hasWeight && hasVehicle) {
      continueBtn.disabled = false;
      continueBtn.className = "w-full h-[52px] rounded-xl flex items-center justify-center font-body-lg-bold text-body-lg-bold transition-all bg-primary-container text-on-surface cursor-pointer shadow-sm active:scale-[0.99]";
    } else {
      continueBtn.disabled = true;
      continueBtn.className = "w-full h-[52px] rounded-xl flex items-center justify-center font-body-lg-bold text-body-lg-bold transition-all bg-[#E5E7EB] text-[#9CA3AF] cursor-not-allowed select-none";
    }
  }

  function selectCargo(buttonEl, label) {
    cargoInput.value = label;
    // Highlight selected chip
    document.querySelectorAll('.cargo-chip').forEach(el => {
      el.style.boxShadow = "0 0 0 1px #E5E7EB";
      el.classList.remove('bg-surface-container');
    });
    buttonEl.style.boxShadow = "0 0 0 1.5px #F59E0B";
    buttonEl.classList.add('bg-surface-container');
    checkFormValidity();
  }

  function selectVehicle(cardEl, id) {
    selectedVehicleId = id;
    document.querySelectorAll('.vehicle-card').forEach(card => {
      card.style.boxShadow = "0 0 0 1px #E5E7EB";
      const badge = card.querySelector('.selected-badge');
      if (badge) badge.classList.add('hidden');
    });

    cardEl.style.boxShadow = "0 0 0 2px #F59E0B";
    const activeBadge = cardEl.querySelector('.selected-badge');
    if (activeBadge) activeBadge.classList.remove('hidden');

    checkFormValidity();
  }

  function toggleRequirement(chipEl) {
    const isSelected = chipEl.dataset.selected === 'true';
    if (!isSelected) {
      chipEl.dataset.selected = 'true';
      chipEl.style.boxShadow = "0 0 0 1.5px #F59E0B";
      chipEl.classList.add('bg-surface-container-low');
      const icon = chipEl.querySelector('.material-symbols-outlined');
      if (icon) icon.classList.replace('text-secondary', 'text-primary');
    } else {
      chipEl.dataset.selected = 'false';
      chipEl.style.boxShadow = "0 0 0 1px #E5E7EB";
      chipEl.classList.remove('bg-surface-container-low');
      const icon = chipEl.querySelector('.material-symbols-outlined');
      if (icon) icon.classList.replace('text-primary', 'text-secondary');
    }
  }

  cargoInput.addEventListener('input', checkFormValidity);
  weightInput.addEventListener('input', checkFormValidity);
</script></main></body></html>
