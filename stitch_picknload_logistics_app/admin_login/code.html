<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={darkMode:"class",theme:{extend:{colors:{"tertiary-fixed":"#7ffc97","surface-container":"#e7eefe","tertiary-container":"#4ac86a","surface-container-low":"#f0f3ff","secondary":"#575e70","surface-bright":"#f9f9ff","on-surface-variant":"#534434","inverse-primary":"#ffb95f","on-background":"#151c27","on-primary-container":"#613b00","error":"#ba1a1a","primary-container":"#f59e0b","surface-dim":"#d3daea","outline-variant":"#d8c3ad","on-primary":"#ffffff","error-container":"#ffdad6","on-secondary-container":"#5c6274","on-secondary":"#ffffff","surface-container-lowest":"#ffffff","surface":"#f9f9ff","outline":"#867461","on-tertiary-fixed-variant":"#005320","background":"#f9f9ff","primary-fixed-dim":"#ffb95f","surface-container-highest":"#dce2f3","on-secondary-fixed":"#141b2b","primary-fixed":"#ffddb8","on-error":"#ffffff","on-tertiary-container":"#004f1f","primary":"#855300","on-primary-fixed":"#2a1700","on-primary-fixed-variant":"#653e00","tertiary":"#006e2d","surface-container-high":"#e2e8f8","surface-variant":"#dce2f3","secondary-fixed-dim":"#c0c6db","on-tertiary":"#ffffff","on-surface":"#151c27","surface-tint":"#855300","on-secondary-fixed-variant":"#404758","inverse-on-surface":"#ebf1ff","on-error-container":"#93000a","on-tertiary-fixed":"#002109","secondary-fixed":"#dce2f7","tertiary-fixed-dim":"#62df7d","secondary-container":"#d9dff5","inverse-surface":"#2a313d"},borderRadius:{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},spacing:{"space-lg":"1.25rem","space-xl":"1.5rem","margin":"1.25rem","space-xs":"0.25rem","space-md":"1rem","gutter":"1rem","space-sm":"0.5rem"},fontFamily:{"headline-md":["Inter"],"body-md-medium":["Inter"],"body-lg":["Inter"],"headline-xl":["Inter"],"label-sm":["Inter"],"label-md":["Inter"],"body-md":["Inter"],"body-lg-bold":["Inter"],"headline-lg":["Inter"]},fontSize:{"headline-md":["18px",{lineHeight:"24px",fontWeight:"600"}],"body-md-medium":["14px",{lineHeight:"20px",fontWeight:"500"}],"body-lg":["16px",{lineHeight:"24px",fontWeight:"400"}],"headline-xl":["26px",{lineHeight:"32px",fontWeight:"700"}],"label-sm":["12px",{lineHeight:"16px",fontWeight:"500"}],"label-md":["13px",{lineHeight:"16px",fontWeight:"600"}],"body-md":["14px",{lineHeight:"20px",fontWeight:"400"}],"body-lg-bold":["16px",{lineHeight:"24px",fontWeight:"600"}],"headline-lg":["22px",{lineHeight:"28px",fontWeight:"700"}]}}}}</script></head><body class="bg-surface-container-low font-body-md text-body-md text-on-surface min-h-screen flex items-center justify-center p-space-md"><main class="w-full max-w-md mx-auto"><div class="flex flex-col w-full items-center justify-center">
<div class="w-full bg-surface-container-lowest rounded-xl p-space-xl shadow-lg">
<div class="flex flex-col items-center">
<div class="w-14 h-14 bg-primary-container rounded-xl flex items-center justify-center text-on-primary shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">local_shipping</span>
</div>
<h1 class="font-headline-xl text-headline-xl text-on-surface text-center mt-space-sm tracking-tight">PickNLoad Admin</h1>
<p class="font-body-md text-body-md text-secondary text-center mt-space-xs mb-space-lg">Sign in to manage the platform</p>
</div>
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); handleLogin();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface" for="admin-email">Email</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-xl pointer-events-none">mail</span>
<input class="w-full h-[50px] pl-10 pr-4 bg-surface-container-low rounded-lg text-on-surface font-body-md text-body-md placeholder-secondary focus:bg-surface-container-lowest focus:outline-none transition-colors" id="admin-email" name="email" placeholder="admin@picknload.com" required="" type="email" value="admin@picknload.com"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface" for="admin-password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:underline transition-all" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary text-xl pointer-events-none">lock</span>
<input class="w-full h-[50px] pl-10 pr-11 bg-surface-container-low rounded-lg text-on-surface font-body-md text-body-md placeholder-secondary focus:bg-surface-container-lowest focus:outline-none transition-colors" id="admin-password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-secondary hover:text-on-surface transition-colors p-1 flex items-center justify-center focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-xl" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary accent-primary-container focus:ring-0 cursor-pointer" type="checkbox"/>
<span class="font-label-sm text-label-sm text-secondary">Trust this terminal for 12 hours</span>
</label>
</div>
<button class="w-full h-[52px] bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-xl transition duration-150 shadow-sm flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.99] mt-space-xs" id="submit-btn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
</div>
<div class="flex items-center justify-center gap-1.5 mt-space-lg text-secondary">
<span class="material-symbols-outlined text-sm">shield</span>
<span class="font-label-sm text-label-sm">Authorized staff only • End-to-end encrypted dispatch access</span>
</div>
<script>
    const passwordInput = document.getElementById('admin-password');
    const toggleButton = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const submitBtn = document.getElementById('submit-btn');

    toggleButton.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    function handleLogin() {
      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span class="material-symbols-outlined animate-spin text-lg">progress_activity</span>
        <span>Authenticating...</span>
      `;
      setTimeout(() => {
        submitBtn.innerHTML = `
          <span class="material-symbols-outlined text-lg">check_circle</span>
          <span>Access Granted</span>
        `;
        submitBtn.classList.remove('bg-primary-container', 'text-on-primary-container');
        submitBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
      }, 900);
    }
  </script>
</div></main></body></html>
